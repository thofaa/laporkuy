services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laporkuy
      POSTGRES_PASSWORD: laporkuy
      POSTGRES_DB: laporkuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    image: oven/bun:1
    restart: unless-stopped
    working_dir: /app
    command: bun --hot src/server/index.js
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html:ro
      - ./package.json:/app/package.json:ro
      - ./node_modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://laporkuy:laporkuy@db:5432/laporkuy
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app

volumes:
  pgdata:
